<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cashew Sheller - Semi-automatic (concept) - Parts drawing sheet
  Sheet: A3 landscape, units: mm (1 unit = 1 mm)
  Parts:  P-01 Holder cup (POM)    P-02 Press plunger (SUS304)    P-03 Lever arm (SUS304), scale 1:2
  Concept-level dimensions only. Verify all values before manufacture.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="Arial, Helvetica, sans-serif" fill="none" stroke="#000">
  <title>Cashew Sheller - Parts Drawing (Concept)</title>
  <defs>
    <pattern id="hatch" width="2" height="2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="2" stroke="#000" stroke-width="0.25"/>
    </pattern>
    <marker id="arr" markerWidth="4" markerHeight="4" refX="4" refY="2" orient="auto">
      <path d="M0,0 L4,2 L0,4 z" fill="#000" stroke="none"/>
    </marker>
  </defs>

  <!-- Sheet border and title block -->
  <rect x="10" y="10" width="400" height="277" stroke-width="0.5"/>
  <rect x="250" y="235" width="160" height="52" stroke-width="0.5"/>
  <line x1="250" y1="247" x2="410" y2="247" stroke-width="0.35"/>
  <line x1="250" y1="256" x2="410" y2="256" stroke-width="0.35"/>
  <line x1="250" y1="265" x2="410" y2="265" stroke-width="0.35"/>
  <line x1="330" y1="247" x2="330" y2="287" stroke-width="0.35"/>
  <g fill="#000" stroke="none" font-size="3.2">
    <text x="253" y="241">CASHEW SHELLER - SEMI-AUTO (CONCEPT)</text>
    <text x="253" y="252">PARTS DRAWING - SHEET 1 OF 1</text>
    <text x="253" y="261.5">Material: POM / SUS304 as noted</text>
    <text x="333" y="261.5">Scale: 1:1 (P-03: 1:2)</text>
    <text x="253" y="270.5">Tolerance: unless noted ±0.1 mm</text>
    <text x="333" y="270.5">Units: mm</text>
    <text x="253" y="280">Dwg no.: CS-SA-001 | Rev A</text>
    <text x="333" y="280">Third-angle projection</text>
  </g>

  <!-- ============ P-01 HOLDER CUP (section A-A) ============ -->
  <g stroke-width="0.35" fill="#000" stroke="none" font-size="3.2">
    <text x="30" y="30" font-size="4.5" font-weight="bold">P-01  HOLDER CUP (POM)  -  SECTION A-A</text>
  </g>
  <g stroke="#000" stroke-width="0.6">
    <!-- walls + floor (section, hatched) -->
    <rect x="55" y="140" width="10" height="40" fill="url(#hatch)"/>
    <rect x="95" y="140" width="10" height="40" fill="url(#hatch)"/>
    <rect x="55" y="172" width="50" height="8" fill="url(#hatch)"/>
  </g>
  <!-- centre line -->
  <line x1="80" y1="134" x2="80" y2="186" stroke="#000" stroke-width="0.2" stroke-dasharray="4 1 1 1"/>
  <!-- dimensions -->
  <g stroke="#000" stroke-width="0.25" fill="none">
    <!-- OD 50 -->
    <line x1="55" y1="192" x2="105" y2="192" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="55" y1="180" x2="55" y2="194"/>
    <line x1="105" y1="180" x2="105" y2="194"/>
    <!-- bore 30 -->
    <line x1="65" y1="131" x2="95" y2="131" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="65" y1="128" x2="65" y2="137"/>
    <line x1="95" y1="128" x2="95" y2="137"/>
    <!-- height 40 -->
    <line x1="46" y1="140" x2="46" y2="180" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="43" y1="140" x2="53" y2="140"/>
    <line x1="43" y1="180" x2="53" y2="180"/>
    <!-- bore depth 32 -->
    <line x1="113" y1="140" x2="113" y2="172" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="105" y1="140" x2="115" y2="140"/>
    <line x1="105" y1="172" x2="115" y2="172"/>
    <!-- floor 8 -->
    <line x1="122" y1="172" x2="122" y2="180" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="105" y1="172" x2="124" y2="172" stroke-dasharray="1 1"/>
    <line x1="105" y1="180" x2="124" y2="180" stroke-dasharray="1 1"/>
  </g>
  <g fill="#000" stroke="none" font-size="3.2">
    <text x="75" y="197">Ø50 OD</text>
    <text x="72" y="129.5">Ø30 BORE</text>
    <text x="36" y="161" transform="rotate(-90 36 161)" text-anchor="middle">40</text>
    <text x="118" y="158" transform="rotate(-90 118 158)" text-anchor="middle">32 DEPTH</text>
    <text x="129" y="177">8</text>
  </g>
  <g fill="#000" stroke="none" font-size="2.8">
    <text x="30" y="210">Notes: 1. Bore Ø30 H9 for nut seating. 2. Break edges 0.5×45°.</text>
    <text x="30" y="214">3. Bore surface Ra 3.2 max. 4. Stainless/POM contact surface must be food-safe.</text>
  </g>

  <!-- ============ P-02 PRESS PLUNGER ============ -->
  <g fill="#000" stroke="none" font-size="4.5" font-weight="bold">
    <text x="170" y="30">P-02  PRESS PLUNGER (SUS304)</text>
  </g>
  <g stroke="#000" stroke-width="0.6" fill="none">
    <!-- head -->
    <rect x="185" y="20" width="30" height="15"/>
    <!-- shaft with chamfered tip -->
    <path d="M194,35 L194,137 L196,140 L204,140 L206,137 L206,35"/>
  </g>
  <line x1="200" y1="14" x2="200" y2="146" stroke="#000" stroke-width="0.2" stroke-dasharray="4 1 1 1"/>
  <g stroke="#000" stroke-width="0.25" fill="none">
    <!-- head dia 30 -->
    <line x1="185" y1="11" x2="215" y2="11" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="185" y1="8" x2="185" y2="18"/>
    <line x1="215" y1="8" x2="215" y2="18"/>
    <!-- shaft dia 12 -->
    <line x1="194" y1="150" x2="206" y2="150" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="194" y1="141" x2="194" y2="153"/>
    <line x1="206" y1="141" x2="206" y2="153"/>
    <!-- overall 120 -->
    <line x1="225" y1="20" x2="225" y2="140" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="182" y1="20" x2="227" y2="20"/>
    <line x1="182" y1="140" x2="227" y2="140"/>
    <!-- head thickness 15 -->
    <line x1="177" y1="20" x2="177" y2="35" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="174" y1="20" x2="186" y2="20"/>
    <line x1="174" y1="35" x2="186" y2="35"/>
  </g>
  <g fill="#000" stroke="none" font-size="3.2">
    <text x="194" y="10">Ø30</text>
    <text x="199" y="157">Ø12</text>
    <text x="230" y="82" transform="rotate(-90 230 82)" text-anchor="middle">120 OVERALL</text>
    <text x="165" y="28" text-anchor="end">15</text>
  </g>
  <g fill="#000" stroke="none" font-size="2.8">
    <text x="170" y="164">Notes: 1. Tip chamfer 2×45°. 2. Head face flat within 0.05 mm.</text>
    <text x="170" y="168">3. Surface finish Ra 1.6 on shaft. 4. Secure to lever with M6 pin.</text>
  </g>

  <!-- ============ P-03 LEVER ARM (scale 1:2) ============ -->
  <g fill="#000" stroke="none" font-size="4.5" font-weight="bold">
    <text x="285" y="45">P-03  LEVER ARM (SUS304)  -  SCALE 1:2</text>
  </g>
  <rect x="290" y="70" width="100" height="15" stroke="#000" stroke-width="0.6" fill="none"/>
  <circle cx="300" cy="77.5" r="3" stroke="#000" stroke-width="0.5" fill="none"/>
  <circle cx="365" cy="77.5" r="3" stroke="#000" stroke-width="0.5" fill="none"/>
  <line x1="300" y1="72" x2="300" y2="83" stroke="#000" stroke-width="0.2" stroke-dasharray="1 1"/>
  <line x1="365" y1="72" x2="365" y2="83" stroke="#000" stroke-width="0.2" stroke-dasharray="1 1"/>
  <g stroke="#000" stroke-width="0.25" fill="none">
    <!-- overall length 200 (actual) -->
    <line x1="290" y1="64" x2="390" y2="64" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="290" y1="60" x2="290" y2="68"/>
    <line x1="390" y1="60" x2="390" y2="68"/>
    <!-- pivot hole to end 20 (actual) -->
    <line x1="290" y1="92" x2="300" y2="92" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <!-- width 30 (actual) -->
    <line x1="398" y1="70" x2="398" y2="85" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="394" y1="70" x2="400" y2="70"/>
    <line x1="394" y1="85" x2="400" y2="85"/>
  </g>
  <g fill="#000" stroke="none" font-size="3.2">
    <text x="331" y="61.5" text-anchor="middle">200 (L)</text>
    <text x="295" y="96" text-anchor="middle">20</text>
    <text x="402" y="78.5">30 (W)</text>
    <text x="300" y="75" font-size="2.4" text-anchor="middle">Ø12</text>
    <text x="365" y="75" font-size="2.4" text-anchor="middle">Ø12</text>
    <text x="332" y="100" text-anchor="middle">Pivot hole Ø12 at 20 from end; press hole Ø12 at 130 from pivot hole</text>
  </g>
  <g fill="#000" stroke="none" font-size="2.8">
    <text x="290" y="112">Notes: 1. Thickness 8 mm. 2. Deburr all edges. 3. Hole Ø12 H9.</text>
    <text x="290" y="116">4. Pivot bushing: POM or bronze. 5. Scale 1:2 shown; dimensions in actual mm.</text>
  </g>
</svg>
